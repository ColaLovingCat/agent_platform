<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文件管理</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    .box-contents {
      display: flex;
      column-gap: 10px;
    }

    .box-table {
      flex: 1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 8px;
    }

    th {
      background-color: #f4f4f4;
    }

    button {
      cursor: pointer;
      color: white;
      background: red;
      border: none;
      padding: 5px 10px;
    }

    .box-upload {
      padding: 10px;
      width: 310px;
      border-radius: 8px;
      box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
    }
  </style>
</head>

<body>
  <div id="app">
    <h3>文件管理系统 (<span>{{msg}}</span>)</h3>
    <div class="box-contents">
      <div class="box-table">
        <table>
          <thead>
            <tr>
              <th>文件名</th>
              <th>大小/KB</th>
              <th>创建时间</th>
              <th>修改时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            <template v-for="item in files" :key="item.name || item.realName">
              <tr>
                <!-- 📁 文件夹展示 -->
                <template v-if="item.isDirectory">
                  <td colspan="5" style="font-weight: bold">
                    📁 <a :href="item.url" target="_blank">{{ item.name }}</a>
                  </td>
                </template>

                <!-- 📄 单文件展示 -->
                <template v-else-if="item.isSingleFile">
                  <td>
                    <span style="font-size: 26px">{{ getFileIcon(item.type) }}</span>
                    <a :href="item.url" target="_blank">{{ item.name }}</a>
                  </td>
                  <td>{{ (item.size / 1024).toFixed(2) }}</td>
                  <td>{{ new Date(item.createdTime).toLocaleString() }}</td>
                  <td>{{ new Date(item.modificationTime).toLocaleString() }}</td>
                  <td>
                    <button @click="deleteFile(item.name)">删除</button>
                  </td>
                </template>

                <!-- 📦 分组标题展示 -->
                <template v-else>
                  <td colspan="5" style="cursor: pointer" @click="item.isOpen = !item.isOpen">
                    <span style="font-size: 26px">{{ getFileIcon(item.type) }}</span>
                    <strong>{{ item.realName }}</strong>
                    <span v-if="item.isOpen">🔽</span>
                    <span v-else>▶️</span>
                  </td>
                </template>
              </tr>

              <!-- 🔽 分组内文件展示 -->
              <tr v-if="!item.isDirectory && !item.isSingleFile && item.isOpen" v-for="file in item.versions"
                :key="file.name" style="background: #f9f9f9;">
                <td>
                  <span style="font-size: 26px">{{ getFileIcon(file.type) }}</span>
                  <a :href="file.url" target="_blank">{{ file.name }}</a>
                </td>
                <td>{{ (file.size / 1024).toFixed(2) }}</td>
                <td>{{ new Date(file.createdTime).toLocaleString() }}</td>
                <td>{{ new Date(file.modificationTime).toLocaleString() }}</td>
                <td>
                  <button @click="deleteFile(file.name)">删除</button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
      <div class="box-upload">
        <input type="file" id="fileInput" />
        <button onclick="uploadFile()">上传</button>
        <p v-for="item in msgs">{{item}}</p>
      </div>
    </div>
  </div>

  <script src="./libs/vue/vue.min.js"></script>
  <script>
    var app = new Vue({
      el: "#app",
      data: {
        msg: "",
        files: [],
        //
        chunkSize: 10 * 1024 * 1024,
        msgs: [],
      },
      methods: {
        delete: (filename) => {
          deleteFile(filename);
        },
        getFileIcon: (filetype) => {
          const ext = filetype.split(".").pop().toLowerCase();
          if (ext == "") return "📁";
          const icons = {
            jpg: "🖼️",
            jpeg: "🖼️",
            png: "🖼️",
            gif: "🖼️",
            doc: "📝",
            docx: "📝",
            csv: "📊",
            xls: "📊",
            xlsx: "📊",
            ppt: "🖥️",
            pptx: "🖥️",
            mp4: "🎥",
            avi: "🎥",
            mov: "🎥",
            mp3: "🎵",
            wav: "🎵",
            zip: "📦",
            rar: "📦",
            pdf: "📜",
            txt: "📜",
            html: "🌍",
            css: "🎨",
            js: "📑",
            json: "📑",
            default: "📄", // 未知类型
          };
          return icons[ext] || icons["default"];
        },
      },
    });
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      loadFiles();
    });

    function loadFiles() {
      app.msg = "获取中...";
      fetch("/api/files/getlist")
        .then((response) => response.json())
        .then((resp) => {
          const { status, data } = resp;
          if (status) {
            app.msg = "获取成功";
            // 
            const folders = [];
            const fileMap = {};
            const singleFiles = [];

            // 先分类为目录或文件
            data.forEach(file => {
              if (file.isDirectory) {
                folders.push({ isDirectory: true, ...file });
              } else {
                const parts = file.name.split("_");
                const realName = parts.slice(1).join("_");

                if (!fileMap[realName]) {
                  fileMap[realName] = [];
                }
                fileMap[realName].push(file);
              }
            });

            const groupedFiles = [];
            Object.entries(fileMap).forEach(([realName, versions]) => {
              if (versions.length === 1) {
                // 只有一个版本的文件，直接展示，不分组
                singleFiles.push(versions[0]);
              } else {
                // 多个版本的，分组展示
                groupedFiles.push({
                  realName,
                  type: versions[0].type,
                  isOpen: false,
                  versions,
                });
              }
            });

            // 最终结果顺序：文件夹 -> 单文件 -> 分组文件
            app.files = [
              ...folders,
              ...singleFiles.map(file => ({ isSingleFile: true, ...file })),
              ...groupedFiles,
            ];
            console.log('Testing: ', app.files)
          } else {
            app.msg = "获取失败";
          }
        })
        .catch((error) => console.error("Error loading files:", error));
    }

    function deleteFile(filename) {
      if (confirm(`确定要删除 ${filename} 吗？`)) {
        fetch("/api/files/delete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ filename }),
        })
          .then((response) => response.json())
          .then((resp) => {
            const { status, data, message } = resp;
            app.msg = message;
            loadFiles();
          })
          .catch((error) => console.error("Error deleting file:", error));
      }
    }
  </script>

  <script>
    async function uploadFile() {
      app.msgs = [];
      //
      const fileInput = document.getElementById("fileInput");
      const file = fileInput.files[0];

      if (!file) {
        alert("请选择一个文件");
        return;
      }

      // 判断文件大小，如果小于 chunkSize 则直接上传
      if (file.size <= app.chunkSize) {
        uploadSingleFile(file);
      } else {
        uploadFileInChunks(file);
      }
    }

    // 直接上传整个文件
    function uploadSingleFile(file) {
      const formData = new FormData();
      formData.append("file", file);

      app.msgs.push(`开始上传...`);

      fetch("/api/upload", {
        method: "POST",
        body: formData,
      })
        .then((response) => response.json())
        .then(
          (resp) => {
            const { status, data } = resp;
            if (status) {
              app.msgs.push(`上传成功`);
              app.msgs.push(`${data.url}`);
              //
              loadFiles();
            }
          },
          (error) => { }
        );
    }

    async function uploadFileInChunks(file) {
      // 分片数
      const totalChunks = Math.ceil(file.size / app.chunkSize);
      app.msgs.push(`分片大小: ${app.chunkSize}`);
      app.msgs.push(`分片数: ${totalChunks}`);
      // 计算文件哈希值
      const hash = await generateFileHash(file);
      app.msgs.push(`哈希值: ${hash}`);

      app.msgs.push(`开始上传...`);
      // 逐个上传分片
      for (let i = 0; i < totalChunks; i++) {
        // 分片
        const chunk = file.slice(i * app.chunkSize, (i + 1) * app.chunkSize);

        const formData = new FormData();
        formData.append("file", chunk);
        formData.append("hash", hash);
        formData.append("chunkIndex", i);
        formData.append("totalChunks", totalChunks);
        formData.append("filename", file.name);

        await fetch("/api/upload/chunk", {
          method: "POST",
          body: formData,
        });
        app.msgs.push(`已上传: ${i + 1}/${totalChunks}`);
      }

      // 发送合并请求
      app.msgs.push(`开始合并...`);
      fetch("/api/upload/merge", {
        method: "POST",
        body: JSON.stringify({ hash, filename: file.name, totalChunks }),
        headers: { "Content-Type": "application/json" },
      })
        .then((response) => response.json())
        .then(
          (resp) => {
            const { status, data } = resp;
            if (status) {
              app.msgs.push(`合并完成`);
              app.msgs.push(`${data.url}`);
              //
              loadFiles();
            }
          },
          (error) => { }
        );
    }

    // 计算文件哈希（简单版本）
    async function generateFileHash(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsArrayBuffer(file);
        reader.onload = (event) => {
          const buffer = event.target.result;
          let hash = 0;
          new Uint8Array(buffer).forEach((byte) => {
            hash = (hash * 31 + byte) % 1000000000; // 计算简单哈希值
          });
          resolve(hash.toString());
        };
      });
    }
  </script>
</body>

</html>
