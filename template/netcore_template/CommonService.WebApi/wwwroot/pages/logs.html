<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            font-family: monospace;
            background: #111;
            color: #ccc;
            padding: 1rem;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .log-inf { color: #6ee7a0; }
        .log-wrn { color: #fbbf24; }
        .log-err { color: #f87171; }
        .log-dbg { color: #94a3b8; }
        .log-default { color: #ccc; }
    </style>
</head>

<body>
    <div id="app">
        <input type="text" v-model="date" />
        <button onclick="loadLog()">刷新</button>
        <pre id="logContainer">加载中...</pre>
    </div>

    <script src="./libs/vue/vue.min.js"></script>
    <script src="./libs/pubs/js/fetch.js"></script>

    <script>
        function getTodayDateStr() {
            var d = new Date();
            return d.getFullYear() +
                String(d.getMonth() + 1).padStart(2, '0') +
                String(d.getDate()).padStart(2, '0');
        }

        var app = new Vue({
            el: '#app',
            data: {
                date: getTodayDateStr()
            }
        })
        function escapeHtml(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function colorizeLog(text) {
            const levelClass = {
                INF: 'inf',
                WRN: 'wrn',
                ERR: 'err',
                DBG: 'dbg',
                FTL: 'err'
            };
            const lineRegex = /^\[\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} (INF|WRN|ERR|DBG|FTL)\]/;
            let currentClass = 'default';

            return text.split('\n').map(function (line) {
                const match = line.match(lineRegex);
                if (match) {
                    currentClass = levelClass[match[1]] || 'default';
                }
                return '<span class="log-' + currentClass + '">' + escapeHtml(line) + '</span>';
            }).join('\n');
        }

        async function loadLog() {
            var container = document.getElementById('logContainer');
            try {
                const res = await fetch('/api/logs/' + app.date);
                if (!res.ok) {
                    container.innerHTML = '<span class="log-err">无法获取日志：' + res.status + '</span>';
                    return;
                }
                const text = await res.text();
                container.innerHTML = colorizeLog(text);
            } catch (err) {
                container.innerHTML = '<span class="log-err">错误：' + escapeHtml(String(err)) + '</span>';
            }
        }

        loadLog();
    </script>
</body>

</html>
